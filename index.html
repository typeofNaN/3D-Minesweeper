<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='25' fill='%2307111b' stroke='%23f2aa3b' stroke-width='3'/%3E%3Cpath d='M9 34c13-8 33-9 46-1M20 13c8 12 8 28 0 39M44 13c-8 12-8 28 0 39' fill='none' stroke='%23f2aa3b' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>Orbital Sweep · 球体扫雷</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, 'Avenir Next', 'Segoe UI', 'PingFang SC', sans-serif;
        --ink: #ecf3f4;
        --muted: #9cadb9;
        --line: rgba(158, 187, 204, 0.38);
        --panel: rgba(8, 19, 29, 0.76);
        --amber: #f2aa3b;
        --cyan: #6db4cb;
        --danger: #df6558;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background:
          radial-gradient(circle at 66% 46%, rgba(62, 93, 116, 0.24), transparent 38%),
          linear-gradient(135deg, #0c1a27 0%, #07111b 46%, #040a10 100%);
        color: var(--ink);
        user-select: none;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        background-image: repeating-linear-gradient(
          90deg,
          transparent 0 119px,
          rgba(255, 255, 255, 0.025) 120px
        );
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
      }
      .hud {
        position: fixed;
        z-index: 2;
        pointer-events: none;
      }
      .brand {
        top: 28px;
        left: 34px;
        display: flex;
        align-items: center;
        gap: 17px;
      }
      .brand-mark {
        width: 54px;
        height: 54px;
        border: 1px solid var(--amber);
        border-radius: 50%;
        position: relative;
        transform: rotate(-12deg);
      }
      .brand-mark::before,
      .brand-mark::after {
        content: '';
        position: absolute;
        border: 1px solid var(--amber);
        border-radius: 50%;
      }
      .brand-mark::before {
        inset: 7px 16px;
      }
      .brand-mark::after {
        left: -8px;
        right: -8px;
        top: 25px;
        height: 10px;
        transform: rotate(14deg);
      }
      .brand-copy {
        border-left: 1px solid var(--amber);
        padding-left: 17px;
      }
      .brand h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.03;
        letter-spacing: 0.22em;
        font-weight: 560;
      }
      .brand p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .telemetry {
        top: 130px;
        left: 34px;
        width: 262px;
        padding: 17px 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(12px);
        clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
      }
      .metric {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }
      .metric:last-child {
        border: 0;
      }
      .metric-label {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      .metric-value {
        font-variant-numeric: tabular-nums;
        font-size: 22px;
        font-weight: 520;
        letter-spacing: 0.08em;
      }
      #mine-count,
      #flag-count {
        color: var(--amber);
      }
      #game-status {
        font-size: 14px;
        letter-spacing: 0;
        color: var(--cyan);
      }
      #game-status[data-status='lost'] {
        color: var(--danger);
      }
      #game-status[data-status='won'] {
        color: var(--amber);
      }
      .controls {
        left: 34px;
        bottom: 30px;
        width: 238px;
        padding: 14px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .control-row {
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 13px;
        color: #d7e1e5;
        font-size: 13px;
        border-bottom: 1px solid rgba(158, 187, 204, 0.22);
      }
      .control-row:last-child {
        border: 0;
      }
      .mouse {
        width: 18px;
        height: 25px;
        border: 1px solid #c9d7dc;
        border-radius: 9px;
        position: relative;
        flex: 0 0 auto;
      }
      .mouse::before {
        content: '';
        position: absolute;
        left: 8px;
        top: 1px;
        width: 1px;
        height: 9px;
        background: #c9d7dc;
      }
      .mouse.left::after,
      .mouse.right::after {
        content: '';
        position: absolute;
        top: 1px;
        width: 7px;
        height: 9px;
        background: var(--amber);
      }
      .mouse.left::after {
        left: 1px;
        border-radius: 7px 0 0 0;
      }
      .mouse.right::after {
        right: 1px;
        border-radius: 0 7px 0 0;
      }
      .mouse.wheel::after {
        content: '';
        position: absolute;
        left: 7px;
        top: 4px;
        width: 3px;
        height: 6px;
        border-radius: 2px;
        background: var(--amber);
        box-shadow: 0 0 0 1px #07111b;
      }
      .difficulty {
        position: fixed;
        z-index: 3;
        top: 30px;
        right: 34px;
        display: flex;
        align-items: stretch;
        border: 1px solid var(--line);
        background: rgba(7, 17, 27, 0.72);
        backdrop-filter: blur(12px);
      }
      button {
        font: inherit;
        color: var(--ink);
      }
      .difficulty button {
        min-width: 78px;
        height: 43px;
        border: 0;
        border-right: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        letter-spacing: 0.07em;
        transition:
          background 0.16s ease,
          color 0.16s ease;
      }
      .difficulty button:hover,
      .difficulty button:focus-visible {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.07);
        outline: none;
      }
      .difficulty button.selected {
        color: #14202a;
        background: var(--amber);
        font-weight: 700;
      }
      #restart {
        width: 48px;
        min-width: 48px;
        border-right: 0;
        font-size: 24px;
        letter-spacing: 0;
      }
      .result {
        position: fixed;
        z-index: 4;
        right: 34px;
        bottom: 30px;
        min-width: 320px;
        padding: 16px 20px 16px 55px;
        border: 1px solid var(--amber);
        background: rgba(12, 24, 34, 0.94);
        transform: translateY(24px);
        opacity: 0;
        pointer-events: none;
        transition: 0.25s ease;
        clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
      }
      .result::before {
        content: '✓';
        position: absolute;
        left: 18px;
        top: 19px;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background: var(--amber);
        color: #17212a;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .result.visible {
        transform: none;
        opacity: 1;
      }
      .result.failure {
        border-color: var(--danger);
      }
      .result.failure::before {
        content: '!';
        background: var(--danger);
        color: white;
      }
      .result strong,
      .result span {
        display: block;
      }
      .result strong {
        font-size: 16px;
      }
      .result span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 820px) {
        .brand {
          top: 18px;
          left: 18px;
        }
        .brand-mark,
        .brand p {
          display: none;
        }
        .brand-copy {
          padding-left: 0;
          border: 0;
        }
        .brand h1 {
          font-size: 17px;
        }
        .telemetry {
          top: 62px;
          left: 18px;
          width: 190px;
          padding: 9px 14px;
        }
        .metric {
          height: 38px;
        }
        .metric-value {
          font-size: 16px;
        }
        .difficulty {
          right: 18px;
          top: 18px;
        }
        .difficulty button {
          min-width: 66px;
          height: 36px;
          font-size: 11px;
        }
        #restart {
          min-width: 40px;
          width: 40px;
        }
        #flag-mode {
          display: block;
        }
        .brand {
          display: none;
        }
        .difficulty {
          left: 18px;
          right: 18px;
          width: auto;
        }
        .difficulty button {
          flex: 1 1 0;
          min-width: 0;
          padding: 0 4px;
        }
        .controls {
          display: none;
        }
        .result {
          left: 18px;
          right: 18px;
          bottom: 18px;
          min-width: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0s !important;
        }
        #flag-mode {
          display: none;
        }
        @media (pointer: coarse) {
          #flag-mode {
            display: block;
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-label="球体扫雷游戏画布"></div>
    <header class="hud brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-copy">
        <h1>ORBITAL<br />SWEEP</h1>
        <p>球体扫雷测绘系统</p>
      </div>
    </header>
    <aside class="hud telemetry" aria-live="polite">
      <div class="metric">
        <span class="metric-label">地雷</span><span class="metric-value" id="mine-count">000</span>
      </div>
      <div class="metric">
        <span class="metric-label">剩余旗帜</span
        ><span class="metric-value" id="flag-count">000</span>
      </div>
      <div class="metric">
        <span class="metric-label">用时</span><span class="metric-value" id="timer">00:00</span>
      </div>
      <div class="metric">
        <span class="metric-label">状态</span
        ><span class="metric-value" id="game-status">等待扫描</span>
      </div>
    </aside>
    <nav class="difficulty" aria-label="难度">
      <button data-difficulty="calm" aria-pressed="false">简单</button>
      <button data-difficulty="dense" aria-pressed="true">标准</button>
      <button data-difficulty="extreme" aria-pressed="false">极限</button>
      <button data-difficulty="nightmare" aria-pressed="false">噩梦</button>
      <button data-difficulty="abyss" aria-pressed="false">深渊</button>
      <button id="flag-mode" title="切换旗帜模式" aria-label="旗帜模式" aria-pressed="false">
        ⚑
      </button>
      <button id="restart" title="重新开始" aria-label="重新开始">↻</button>
    </nav>
    <aside class="hud controls" aria-label="操作说明">
      <div class="control-row"><i class="mouse"></i><span>拖动旋转球体</span></div>
      <div class="control-row"><i class="mouse left"></i><span>左键揭开格子</span></div>
      <div class="control-row"><i class="mouse right"></i><span>右键标记地雷</span></div>
      <div class="control-row"><i class="mouse wheel"></i><span>滚轮缩放视角</span></div>
    </aside>
    <div class="result" id="result" role="status">
      <strong>Sector cleared</strong><span>All safe cells verified.</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
